  "DbProxyEndpoint=/qa/cyc-cofersa/db/proxy-endpoint",
  "DbSecretName=/qa/cyc-cofersa/db/app",
  "DbName=cof_qa_cyc_cofersa_db",
  "AllowedOrigins=/qa/cyc-cofersa/frontend/origin",
]
tags = [
  "Project=CYC_COFERSA",
  "Environment=QA",
  "Name=qa-cyc-cofersa-api",
]

[prod.build.parameters]
