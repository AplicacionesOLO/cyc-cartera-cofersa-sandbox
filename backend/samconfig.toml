version = 0.1

[dev.build.parameters]
cached = true
parallel = true

[dev.deploy.parameters]
stack_name = "dev-cyc-cofersa-api"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
s3_prefix = "dev-cyc-cofersa-api"
parameter_overrides = [
  "Environment=dev",
  "VpcSubnetIds=/dev/cyc-cofersa/network/subnets",
  "LambdaSecurityGroupId=/dev/cyc-cofersa/network/lambda-sg",
  "DbProxyEndpoint=/dev/cyc-cofersa/db/proxy-endpoint",
  "DbSecretName=/dev/cyc-cofersa/db/app",
  "DbName=cof_dev_cyc_cofersa_db",
  "AllowedOrigins=/dev/cyc-cofersa/frontend/origin",
  "GoogleOAuthSecretName=/dev/cyc-cofersa/google-oauth",
]
tags = [
  "Project=CYC_COFERSA",
  "Environment=DEV",
  "Name=dev-cyc-cofersa-api",
]

