- '[solicitudes] Guard del módulo también en backend: todos los endpoints exigen COORDINADOR/GERENCIA o puede_gestionar_cartera
  (ANALISTA, o ANALISTA_RIESGO con cartera); GERENCIA no escribe. Las páginas detalle y nueva (incluida /clientes/[cod]/solicitudes/nueva)
  aplican el mismo redirect que el listado.'
- '[solicitudes] El correo (ambas ramas) sale con UsuarioMailer (refresh token guardado del solicitante); el front
  ya no envía providerToken/providerRefreshToken. EMAIL_COORDINADOR → integration_config(''email_coordinador'')
  con fallback jdiaz@cofersa.cr; NEXT_PUBLIC_APP_URL → integration_config(''app_url'') con fallback https://cyc-cartera-cofersa.vercel.app.'
- '[solicitudes] El correo se envía después del commit (la solicitud no se deshace si Gmail falla, igual que el
  original).'
incompatibilities:
- '[analisis_pagos] Antes el p_email del análisis lo decidía el front (esAnalista); ahora el backend lo fuerza al
  email propio para ANALISTA / ANALISTA_RIESGO con cartera aunque se pida otro, y bloquea Concentración para ellos
  (antes solo lo ocultaba la UI).'
- '[analisis_pagos] checkCoordinador no exigía usuarios.activo; require_usuario sí (usuario inactivo → 403 acceso_denegado).'
- '[auditoria_legal] Rate limit de solicitudes (30/hora): antes respondía 429; ahora 422 (BusinessRuleViolation
  code rate_limited) con el mismo mensaje — el adaptador HTTP no tiene 429.'
- '[auditoria_legal] Usuario sin fila en usuarios: antes 400 ''Tu usuario no está registrado en el sistema.''; ahora
  403 acceso_denegado de require_usuario (el layout ya no deja entrar a esos usuarios).'
- '[auditoria_legal] Error de Gmail: antes se distinguía 401/403 de Gmail con textos propios; ahora email_error
  trae el mensaje de UsuarioMailer (''No se pudo obtener acceso a Gmail...'' sin refresh token, o ''Gmail rechazó
  el envío: ...'').'
- '[auditoria_legal] GET /actualizar-perfil/{token} con token inválido devuelve 404 {error:{message:''Este enlace
  ya no es válido.''}} en vez de {valido:false}; la página pública lo trata igual (muestra ''Este enlace ya no es
  válido'').'
- '[auditoria_legal] El tope de tamaño de la subida a S3 no se puede imponer en una URL PUT prefirmada: se valida
  el tamaño declarado al firmar y el real al confirmar (si excede se borra el objeto y se responde el mismo error).'
- '[centro_recursos] Las URLs de documentos ya no son permanentes: caducan a la hora. Si el usuario deja la pantalla
  abierta más de 1 h, el enlace de descarga expira y debe recargar la página.'
- '[centro_recursos] Errores de base de datos que antes devolvían error.message de PostgREST (500) ahora devuelven
  el mensaje genérico del adaptador (500) o el de translate_db_error (p. ej. FK inválida de comprador → 409).'
- '[centro_recursos] PUT /centro-recursos/aplicaciones/{id} sin campos editables devuelve la fila actual (en el
  origen el update vacío de PostgREST era indefinido).'
- '[clientes] Límite de 30 correos/hora: el original respondía 429; ahora BusinessRuleViolation (422) con el mismo
  mensaje (''Límite de 30 correos por hora alcanzado. Esperá unos minutos.'').'
- '[clientes] Sin Gmail conectado el mensaje ahora es el de UsuarioMailer (gmail_no_conectado) en lugar de ''Sesión
  de Google expirada. Cerrá sesión y volvé a ingresar.''; un rechazo de Gmail en email-cobro llega como ''Gmail
  rechazó el envío: ...'' (antes ''Error Gmail API: ...''); en estado-cuenta se sigue devolviendo en email_error
  con 200.'
- '[clientes] POST /api/clientes/estado estaba roto en el origen (hacía .select(''analista_id, nombre'') sobre maestro_clientes,
  columnas inexistentes) y no tenía llamadores en el front. Se implementó el comportamiento intencionado: actualiza
  estado_manual, registra gestión SISTEMA y notifica al analista asignado resolviendo su id por maestro_clientes.analista_email
  (solo usuarios activos). Cliente inexistente → 404 ''Cliente no encontrado''.'
- '[clientes] La hora/fecha de la gestión SISTEMA de cambio de estado ahora es hora Costa Rica (el original usaba
  la hora del servidor/UTC).'
- '[clientes] GERENCIA ya no puede enviar email de cobro/estado de cuenta ni registrar recordatorios (require_escritura);
  en el origen solo lo impedía la UI.'
- '[clientes] Un usuario autenticado sin fila activa en usuarios recibe 403 en /clientes/buscar (antes RLS devolvía
  listas vacías); el buscador muestra listas vacías igual.'
- '[clientes] Los adjuntos PDF/Excel siguen viajando en base64 en el JSON: API Gateway/Lambda limitan el payload
  (~6 MB en Lambda síncrona).'
- '[configuracion] Errores de base de datos: antes la UI mostraba error.message de PostgREST (p. ej. ''duplicate
  key value violates unique constraint ...''); ahora los errores de unicidad/FK/NOT NULL llegan traducidos por el
  adaptador (''El registro ya existe.'', ''La operación viola una referencia entre registros.'', ''Los datos no
  cumplen las reglas de la base de datos.''). Ej.: crear un supervisor sin email (tbl_supervisores.email es NOT
  NULL, igual que en Supabase) sigue fallando, con el mensaje genérico.'
- '[configuracion] El filtro q del directorio escapa % y _ (antes se interpolaban crudos en el .or() de PostgREST).'
- '[configuracion] PUT /configuracion/portafolio-acotado/{principal_cod} con el principal dentro de miembros: antes
  los cambios de nombre/rol ya quedaban guardados antes del 400; ahora el 400 revierte toda la operación.'
- '[configuracion] Ids inválidos: PUT usuarios/directorio con id no-UUID responde 404 con el mismo texto (''Usuario
  no encontrado'' / ''Contacto no encontrado''); DELETE directorio y PATCH feed con id no-UUID responden 400 (antes
  500 con el error de PostgreSQL).'
- '[dashboard] Antes cada consulta tenía fallback silencioso (Promise.allSettled → ceros/listas vacías). Ahora el
  endpoint agregado corre en una sola transacción: si falla, la página muestra ''No se pudo cargar el dashboard:
  <mensaje>'' (regla 8) en vez de KPIs en cero. La lista de analistas con cartera sí conserva el fallback (Mi Equipo
  vacío).'
- '[dashboard] La vista icp_por_cliente se toleraba ausente en el origen; en Aurora vw_icp_por_cliente existe, así
  que se consulta directo.'
- '[dashboard] tbl_cartera no tiene columna dias_mora (tampoco la tenía cartera en Supabase): el origen leía c.dias_mora
  → undefined → 0; el backend replica dias_mora = 0 para que el scoring dé exactamente los mismos resultados.'
- '[dashboard] Los conteos de gestiones de Mi Equipo y la lista de clientes de la cola ya no sufren el tope de 1000
  filas de PostgREST (antes gMes podía quedar truncado en analistas con >1000 gestiones/mes).'
- '[dashboard] Orden de desempate de la cola: el origen ordenaba por score/mora con orden base Object.values() (claves
  numéricas primero); el backend usa el orden de lectura de la BD. Solo afecta empates exactos de score y mora.'
- '[gestion_cartera] En Supabase el reporte de pago fallaba siempre por RLS (reportes_pago sin políticas + cliente
  de sesión); en AWS funciona con la regla de ReportarPagoUseCase. El toast dice ''el coordinador recibirá una notificación''
  pero no existe trigger de notificación sobre tbl_reportes_pago (tampoco en el origen): se conservó el texto.'
- '[gestion_cartera] Las URLs públicas de comprobantes ya guardadas en url_comprobante dejan de funcionar al apagar
  Supabase Storage; ObtenerUrlComprobanteUseCase extrae la key de esas URLs, pero los objetos deben copiarse al
  bucket S3 con la misma ruta (cliente_cod/archivo).'
- '[gestion_cartera] El update de un saldo de otra cartera antes ''tenía éxito'' en silencio (RLS filtraba 0 filas);
  ahora responde 403 y la UI muestra ''No se pudo marcar como aplicado. Intentá de nuevo.''.'
- '[gestion_cartera] PUT /pedidos-retenidos/{id} con un id inexistente responde 404 ''Pedido retenido no encontrado''
  (antes 500 con el error de .single()).'
- '[gestiones] El 401/503 que la API Route distinguia (sesion vencida vs. Supabase Auth caido) ahora lo emite API
  Gateway/Cognito antes de la Lambda: useNuevaGestionController mapea 401 -> ''Su sesion vencio...'' y error de
  red/503 -> ''El servicio de autenticacion no esta respondiendo...'' (mismos textos que el original).'
- '[gestiones] El monto en el mensaje de promesa duplicada usaba toLocaleString(''es-CR''); ahora usa el formato
  fmtCRC (simbolo de colon + punto de miles, redondeado) por la regla 4 del CLAUDE.md.'
- '[gestiones] La consulta de solicitudes ligadas en la bandeja dependia de la RLS de solicitudes; ahora se limita
  a solicitudes cuyas gestiones estan en el alcance del usuario (misma informacion para la UI).'
- '[identidad] Login silencioso de Google (login_hint + prompt=none desde la app): el Hosted UI de Cognito no permite
  pasar esos parámetros al IdP; el usuario hace clic en ''Ingresar con Google'' (Cognito recuerda la sesión del
  IdP).'
- '[identidad] Login correo/contraseña: en Supabase existía para cuentas no-Google; en Cognito requiere crear esos
  usuarios en el User Pool (las contraseñas de Supabase no se pueden migrar).'
- '[jobs] El 202 de /sync/pagos y /sync/pedidos-retenidos ya no trae resultado ni n8n_status: la UI lo reconstruye
  de la fila de sync_log (insertados, en_stage, omitidos, total_tabla). Para pedidos, ''actualizados'' no se guarda
  en sync_log: se deriva como max(en_stage - insertados - omitidos, 0) (exacto salvo duplicados en el stage).'
- '[jobs] Si el worker tarda más de 120 s la UI muestra ''La sincronización sigue en proceso; el historial se actualizará
  al terminar.'' en vez de bloquear el botón.'
- '[jobs] Un fallo de conexión/BD en el worker se reintenta (SQS, hasta 5 veces y luego DLQ) y vuelve a llamar al
  webhook N8N; el original fallaba una sola vez con 500. Los errores de negocio de fn_sync_* no reintentan: la función
  los registra en sync_log.error y devuelve {error}, como antes.'
- '[jobs] EventBridge Scheduler no tiene equivalente a cron.job_run_details: el historial de ejecuciones queda en
  CloudWatch Logs/Metrics de cada Lambda (y en sync_log para los sync_*).'
- '[jobs] La ingesta no es el upsert genérico de PostgREST (on_conflict libre): la clave de conflicto es fija por
  tabla y el modo actualizar es explícito.'
- '[notificaciones] Las notificaciones nuevas aparecen con hasta 60 s de demora (o al enfocar la ventana) en lugar
  de instantáneamente por Realtime.'
- '[notificaciones] Chat del equipo: sin Supabase Realtime ni Presence no hay mensajes en vivo ni lista de conectados
  (conectados = []). El ChatPanel está desmontado en ClientWrapper (''ChatPanel desactivado''), así que no hay impacto
  visible.'
- '[notificaciones] /api/tipo-cambio tenía revalidate = 3600 (caché de Next); en la Lambda cada GET /tipo-cambio
  consulta al BCCR (el topbar lo pide una vez al montar, y persiste entre navegaciones).'
- '[notificaciones] /api/tipo-cambio era público (sin sesión); GET /tipo-cambio exige token Cognito (solo lo usa
  el topbar autenticado).'
- '[notificaciones] MarcarNotificacionLeida sobre una notificación ajena o inexistente responde 404 (antes el UPDATE
  con RLS afectaba 0 filas en silencio); el controller ignora el error igual que el original.'
- '[presupuesto] El original devolvía HTTP 200 con {ok:false, email_sent:false, error} cuando Gmail rechazaba el
  envío; ahora UsuarioMailer lanza BusinessRuleViolation (422) y la UI muestra el mismo mensaje vía ApiError.message
  en el mismo recuadro de resultado.'
- '[presupuesto] Sin provider_token de Supabase: el envío usa siempre el refresh token de Gmail persistido; si no
  existe se muestra MSG_GMAIL_NO_CONECTADO (antes ''Sesión de Google expirada...'').'
- '[presupuesto] GERENCIA podía (por RLS solo_usuarios_activos) congelar/editar el presupuesto desde la UI; ahora
  las escrituras exigen COORDINADOR (regla de solo lectura de GERENCIA del CLAUDE.md). La UI sigue mostrando los
  botones; el error se muestra con el mismo alert(''Error al aplicar el cambio.'').'
- '[promesas] mark-promesas-incumplidas (Edge Function Deno con service role) no tiene equivalente en este modulo:
  su funcion la cumple fn_conciliar_promesas via el cron del modulo jobs.'
- '[promesas] Los montos en las descripciones de eventos (abono, reprogramacion) usaban toLocaleString(''es-CR'');
  ahora fmtCRC (simbolo de colon + punto de miles) por la regla 4 del CLAUDE.md. Los eventos historicos ya guardados
  no cambian.'
- '[promesas] El texto ''Para reprogramar use /api/promesas/reprogramar'' del error de estado invalido se conserva
  literal aunque el path real es /clientes/promesas/reprogramar.'
- '[reportes] POST /reportes/enviar: el origen respondía 200 {ok:false, email_sent:false, error} si Gmail fallaba;
  ahora el fallo de Gmail es 422 (BusinessRuleViolation) y el front muestra ApiError.message. En éxito se mantiene
  {ok:true, email_sent:true, to}. Sin refresh token de Gmail el mensaje es el de UsuarioMailer (antes ''Sesión de
  Google expirada...'').'
- '[reportes] Cierre manual del CEI (fn_snapshot_cierre_cartera): antes cualquier usuario activo (incluida GERENCIA)
  podía dispararlo; ahora require_escritura → solo COORDINADOR (GERENCIA recibe 403 y ve el alert ''No se pudo guardar
  el cierre de cartera.'').'
- '[reportes] resumen-ejecutivo / cierre-mensual: el origen degradaba por consulta (Promise.allSettled / errores
  ignorados); ahora si el endpoint agregado falla la página muestra un mensaje de error (regla 8) en vez de datos
  parciales.'
- '[reportes] Snapshot semanal de bloqueados: se ejecuta en una transacción propia; si falla (DomainError) se ignora
  igual que el origen.'
- '[solicitudes] Adjuntos: el bucket comprobantes-pago era público (getPublicUrl) y en AWS es privado. El front
  pide URL prefirmada (POST /solicitudes/adjuntos/upload-url) y guarda la key en datos.adjuntos[].path con url=null;
  GET /solicitudes/{id} firma cada adjunto (1 h). Para filas migradas con URL pública de Supabase se extrae la key
  de la URL (/storage/v1/object/public/comprobantes-pago/<key>) y se firma igual.'
- '[solicitudes] Los links de adjuntos en el correo son URLs prefirmadas (pedido de 7 días); con credenciales temporales
  del rol de la Lambda caducan antes (al expirar la sesión). Antes eran URLs públicas permanentes. El adjunto sigue
  accesible desde el detalle de la solicitud en el SIC.'
- '[solicitudes] Rama legacy sin acceso a Gmail: antes 401 ''Sesión de Google expirada...''; ahora 422 (gmail_no_conectado)
  con el MISMO texto, para no disparar el cierre de sesión de Cognito que hace el cliente HTTP ante un 401. Sigue
  sin insertar la solicitud.'
- '[solicitudes] Errores de Gmail: GmailApiSender no distingue 401/403, así que email_error muestra ''Gmail rechazó
  el envío: <detalle>'' en vez de los textos específicos 401/403 del original; sin refresh token (rama catálogo)
  se mantiene ''Token de Google no disponible y no se pudo renovar...''.'
- '[solicitudes] PATCH /solicitudes/{id}/estado: en el original, un analista sobre una solicitud propia que no estuviera
  en ''PENDIENTE'' (p. ej. las del catálogo nuevo, que nacen ''Pendiente'') recibía ok=true y se insertaba historial,
  pero el UPDATE quedaba anulado en silencio por RLS. Ahora se responde 403 ''Sin permisos para cambiar el estado
  de la solicitud'' y no se escribe historial.'
- '[solicitudes] PATCH /solicitudes/{id} con una accion desconocida ahora responde 400 ''accion inválida'' (antes
  hacía un update parcial).'
- '[solicitudes] Comentarios: ahora la solicitud tiene que ser visible para el usuario (404 si no); antes RLS dejaba
  comentar cualquier solicitud por id.'
migration_risks:
- '[analisis_pagos] fn_analisis_* recalculan ICP sobre 9 meses de tbl_pagos: vigilar el límite de 29 s de API Gateway
  con el volumen real.'
- '[analisis_pagos] path param {no_recibo}: recibos con caracteres especiales viajan codificados (seg()) y API Gateway
  los entrega decodificados; el recibo ''—'' (sin número) también se puede desmarcar.'
- '[auditoria_legal] Archivos huérfanos en expedientes-clientes / garantias-legal si el cliente sube a S3 y nunca
  confirma; conviene una regla de ciclo de vida o limpieza periódica.'
- '[auditoria_legal] Migración de datos de Storage: copiar los objetos de los buckets de Supabase garantias-legal
  y expedientes-clientes a S3 con la MISMA key (las filas guardan esa ruta); documento_pdf_url con URL pública de
  Supabase sigue funcionando por la extracción de la key.'
