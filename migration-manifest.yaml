- '[reportes] cartera-vencida: maestro + cartera + última gestión en una sola consulta SQL (subselect max(fecha)).'
- '[reportes] DimensionFilter, VendedorEnvioPanel, detalle-bloqueados, resumen-ejecutivo-cliente: datos y envío
  vía hooks de src/views/reportes/hooks; ya no se manda providerToken.'
- '[reportes] Borrada src/app/api/reportes/enviar/route.ts → POST /reportes/enviar (UsuarioMailer, adjunto base64
  → EmailAttachment).'
- '[solicitudes] Las 4 API Routes (/api/solicitudes, /[id], /[id]/estado, /[id]/comentarios) pasan a SolicitudesApi
  con los mismos paths sin /api, mismos bodies y misma forma de respuesta (ok, id, numero, email_sent, email_to,
  email_error...).'
- '[solicitudes] Las consultas directas de los Server Components se agrupan en un endpoint por pantalla: GET /solicitudes
  (lista + solicitante_map), GET /solicitudes/{id} (solicitud + comentarios + historial con autor_nombre + gestion_origen
  + solicitante_nombre), GET /solicitudes/nueva-clientes (cartera + maestro + analista_nombres + gestion_origen)
