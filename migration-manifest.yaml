  x'', ''No tenés permiso para enviar estos reportes''); respuesta {ok, email_sent, to}.'
- '[presupuesto] tab-sin-pago: fn_sin_pago_cliente + SUM(presupuesto_cobro.ppto_cartera) en un único GET /presupuesto/sin-pago
