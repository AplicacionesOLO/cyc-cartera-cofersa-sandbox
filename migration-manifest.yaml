- '[jobs] pg_cron → EventBridge Scheduler (ScheduleV2, UTC): 17 Lambdas programadas, una por job lógico (handlers
  en entrypoints/lambda_handlers/jobs_programados.py → EjecutarTareaProgramadaUseCase con uow_factory(None) = service_role).
  Mismos horarios UTC; los 55 jobs sync_*_HHMMcr (5 tipos × 11 horas) se consolidan en 5 reglas cron(5 13-23 * *
  ? *) todos los días, igual que el original. Las fn_* siguen leyendo sus toggles tbl_config_sistema.automatizacion_*_activa.'
- '[jobs] POST /api/sync/{pagos,pedidos-retenidos} esperaban a N8N (hasta 30 s) + 12 s (> 29 s de API Gateway):
  ahora POST /sync/pagos y /sync/pedidos-retenidos validan COORDINADOR, encolan en SQS sync-manual y responden 202
  {ok, encolado, tipo, solicitado_en, n8n_configurado}. El worker sync-manual-worker (timeout 90 s, visibility 540
  s, DLQ, maxReceive 5, ReportBatchItemFailures, idempotencia DynamoDB) llama al webhook N8N (n8n_webhook_pagos_url
  con fallback https://n8n.mayoreo.biz/webhook/Flujos_SIC; n8n_webhook_pedidos_retenidos_url, sin fallback como
  el original), espera 12 s y ejecuta fn_sync_* con p_ejecutado_por = email del coordinador.'
- '[jobs] UI (TabSincronizacion.tsx): mismo JSX; los datos salen de views/sincronizacion (sincronizacionApi + useSincronizacionController).
  Para pagos/pedidos mantiene el estado ''en proceso'' (fases originales) y consulta GET /sync/estado?tipo=&desde=solicitado_en
  cada 4 s (máx. 120 s) hasta ver la fila nueva de sync_log; luego arma el mismo mensaje y refresca GET /sync/historial
  (antes supabase.from(''sync_log'') limit 600).'
- '[jobs] cartera/facturas/saldos_favor manuales siguen síncronos: POST /sync/{cartera,facturas,saldos_favor} →
  fn_sync_*(p_ejecutado_por) → {ok, resultado}. Se borraron las 5 route.ts de src/app/api/sync/.'
- '[jobs] Ingesta externa: N8N y Google Apps Script ya NO pueden escribir directo en la base (Aurora en VPC privada,
  sin PostgREST). Nuevo POST /ingesta/{tabla} (Lambda IngestaApi, sin Cognito, header x-ingesta-key validado con
  hmac.compare_digest contra ingesta_api_key del secreto) para pagos_stage, pedidos_retenidos_stage, cartera, facturas,
  saldos_favor y maestro_clientes. Cuerpo {modo: reemplazar|agregar|actualizar, lote, total_lotes, sync_id?, purgar_anteriores?,
  filas:[...]}; lista blanca de columnas por tabla (domain/entities/jobs.py TABLAS_INGESTA; columna desconocida
  = 400, igual que PostgREST); todas las filas del lote con las mismas columnas; máx. 5000 filas/lote; cada lote
  es UNA transacción. reemplazar: DELETE de la tabla destino en el lote 1 y luego INSERT. actualizar: INSERT ...
  ON CONFLICT (clave natural) DO UPDATE de las columnas recibidas (+ updated_at = now()); con purgar_anteriores
  en el último lote borra las filas de otro sync_id (equivale al upsert + ''DELETE por sync_id'' que hacía N8N en
  saldos_favor). El sync_id del cuerpo se agrega a las filas que no lo traen. En las tablas stage los valores se
  guardan como texto (fn_cargar_pagos_stage / fn_sync_pedidos_retenidos castean igual que antes).'
- '[jobs] Modos por tabla: pagos_stage y pedidos_retenidos_stage → reemplazar|agregar; cartera y facturas → reemplazar|agregar|actualizar
  (clave contribuyente+cliente_cod / contribuyente+documento); saldos_favor → agregar|actualizar (clave documento;
  sin reemplazar para no perder estado_manual/aplicado_por/aplicado_en del SIC); maestro_clientes → agregar|actualizar
  (clave cliente_cod, upsert diario del GAS; sin reemplazar: tbl_solicitudes.cliente_id ON DELETE SET NULL y columnas
  SIC-exclusivas). maestro_clientes no acepta estado_manual, asignacion_manual ni la logística SIC (dia_visita,
  dia_pago, metodo_pago, observaciones_logistica, hora_recibo_*, persona_recibe); los triggers fn_proteger_contacto_manual,
  fn_asignar_analista_por_vendedor y fn_sincronizar_analista_nombre siguen activos.'
- '[jobs] Se copiaron tal cual los assets de la skill (assets/backend-async): application/ports/message_queue.py,
