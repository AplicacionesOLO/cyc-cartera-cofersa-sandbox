scheduled_jobs:
- name: check-recibos-reversion
  schedule: cron(15 23 ? * MON-FRI *)
  function: job-check-recibos-reversion
  handler: entrypoints.lambda_handlers.jobs_programados.check_recibos_reversion_job
  timeout: 120
  source: 'pg_cron: check_recibos_reversion ''15 23 * * 1-5'''
