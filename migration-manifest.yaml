structural_changes:
- '[analisis_pagos] Las 4 API Routes de Next (pagos-anulados, pagos-anulados/[no_recibo], pagos-duplicado-descartado,
  pagos-duplicado-descartado/[no_recibo]) se borraron y quedan como endpoints de AnalisisPagosApi con el mismo método,
  body y respuesta ({ok, marcados} / {ok}); el upsert con service role pasa a INSERT ... ON CONFLICT en el repository
  y la auditoría a tbl_config_audit_log dentro de un SAVEPOINT (un fallo de auditoría no aborta, como insertAuditLog).'
- '[analisis_pagos] Los RPC fn_analisis_ranking_clientes / perfil_vendedor / alertas_deterioro / concentracion y
  fn_pagos_mes_resumen pasan a GET /analisis-pagos/* con los mismos parámetros (query string) y la misma forma JSON.'
- '[analisis_pagos] Frontend: módulo src/views/analisis-pagos (api/analisis-pagos-api.ts, hooks/use-analisis-icp-controller.ts,
  hooks/use-pagos-aplicados-controller.ts, use-remote-resource.ts, types.ts). Tab*/PagosAplicadosCliente conservan
  su JSX; los modales Anular/Descartar usan controllers propios. Los tipos ReciboRow/ResumenResult salieron del
  componente a views/analisis-pagos/types.ts.'
- '[analisis_pagos] Las páginas host (gestion-pagos/analisis/page.tsx y reportes/pagos-aplicados/page.tsx) no usaban
  Supabase (getUsuarioActual ya migrado): no se modificaron.'
- '[auditoria_legal] Las 8 API Routes de /api/auditoria-legal/** y /api/actualizar-perfil/[token] pasan a la Lambda
  AuditoriaLegalApi (paths /garantias*, /solicitudes-actualizacion*) y a la Lambda pública ActualizarPerfilApi (/actualizar-perfil/{token}*).
  Mismos cuerpos, respuestas y textos de error.'
- '[auditoria_legal] Las consultas directas de supabase-js de la pantalla de Garantías y sus modales (fn_garantias_lista,
  fn_garantias_clientes_sin_garantia, fn_buscar_contribuyentes, fn_saldo_contribuyente, fn_vendedores_por_contribuyente,
  fn_contar_garantias_en_carpeta, fn_siguiente_carpeta_disponible, garantia_eventos+usuarios, personas_legales,
  config_sistema, vendedores, solicitudes_actualizacion) son endpoints GET con intención bajo /garantias/* y /solicitudes-actualizacion.'
- '[auditoria_legal] Subidas: el PDF firmado (antes multipart a la API Route → bucket público) y los archivos del
  portal público (antes multipart) ahora van directo a S3 con URL prefirmada PUT emitida por el backend, y un segundo
  POST confirma (el backend verifica existencia, prefijo de la key y tamaño con list()).'
- '[auditoria_legal] garantias.documento_pdf_url guarda ahora la key S3 (`<id>_<ms>.pdf`); al listar se devuelve
  una URL prefirmada GET (1 h). Las filas migradas con la URL pública de Supabase se resuelven extrayendo la key
  tras ''/garantias-legal/''.'
- '[auditoria_legal] Gmail (correo al vendedor en ENTREGAR, correo de Auditoría Anual al crear/reenviar solicitud)
  lo envía el backend con UsuarioMailer; el front ya no manda providerToken/providerRefreshToken.'
- '[auditoria_legal] POST /garantias corre en una sola transacción (consecutivo, desactivar anterior, insertar,
  eventos, vínculo, notificación al coordinador): ya no hace falta la compensación manual de reactivar la anterior.'
- '[auditoria_legal] fetchSolicitudes: el backend devuelve todas las solicitudes ENVIADA/DATOS_RECIBIDOS/APROBADA/EXPIRADA
  y el front filtra por los contribuyentes del tab (antes .in(''contribuyente'', [...]) con cientos de valores,
  que no cabe en una query string).'
- '[auditoria_legal] Hacienda: los modales usan useHaciendaController (módulo notificaciones, GET /hacienda) en
  vez de fetch(''/api/hacienda'').'
