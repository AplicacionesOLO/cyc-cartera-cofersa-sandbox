- '[presupuesto] Congelar, regenerar, editar meta y reasignar (antes rpc genérico con p_email del front) son POST
  /presupuesto/mes/{congelar|meta|reasignar}; el email que se guarda en generado_por/updated_por es el del usuario
  autenticado (no el que mande el front). La prop userEmail de TabPresupuesto queda sin uso.'
- '[presupuesto] Modal ''Enviar Presupuesto General'': las 5 lecturas (vendedores, supervisores, usuarios+cartera
  real, portafolio_grupos, portafolio_acotado) pasan a GET /presupuesto/destinatarios + analistasConCarteraReal
  (GET /me/analistas-con-cartera); el cruce de destinatarios y filas del correo se conserva idéntico en use-envio-presupuesto-general-controller.'
- '[presupuesto] Envío por correo de tab-presupuesto y tab-recuperacion (antes fetch a /api/reportes/enviar con
