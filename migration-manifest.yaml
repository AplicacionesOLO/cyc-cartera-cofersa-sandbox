- '[promesas] Reprogramar: INSERT de la promesa nueva + UPDATE de la original a REPROGRAMADA en UNA transaccion
  (antes 2 escrituras con rollback manual via DELETE, que fallaba por falta de politica DELETE).'
- '[promesas] Validar/Reprogramar leen la promesa con SELECT ... FOR UPDATE antes de anexar el evento al JSONB eventos
  (evita perder eventos con dos validaciones simultaneas).'
- '[promesas] DELETE /clientes/promesas recibe el id por query (?id=); el handler acepta tambien {id} en el body.
  Hoy ninguna pantalla lo llama.'
- '[promesas] Edge Function supabase/functions/mark-promesas-incumplidas NO se porta: esta OBSOLETA desde 2026-06-15
  (reemplazada por fn_conciliar_promesas via cron, que migra el modulo jobs). No tiene endpoint ni job en este modulo.'
- '[promesas] El modal de accion de tabla-promesas.tsx usa useAccionPromesaController (src/views/promesas/hooks)
  -> promesasApi; JSX, validaciones de cliente y textos sin cambios. GestionOrigen se movio a src/views/promesas/types.ts
