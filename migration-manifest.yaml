  schedule: cron(15 13-23 ? * MON-FRI *)
  function: job-check-sync-salud
  handler: entrypoints.lambda_handlers.jobs_programados.check_sync_salud_job
  timeout: 120
  source: 'pg_cron: check_sync_salud ''15 13-23 * * 1-5'''
