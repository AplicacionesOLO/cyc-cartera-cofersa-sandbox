- '[presupuesto] Frontend: módulo src/views/presupuesto (api/presupuesto-api.ts, hooks/use-*-controller.ts, use-remote-resource.ts
  con AbortController, types.ts). Los componentes conservan su JSX; solo cambian las fuentes de datos.'
- '[presupuesto] fn_presupuesto_calc y fn__recalc_metas no se exponen: se ejecutan dentro de fn_presupuesto_guardar
  / fn_presupuesto_preview / fn_presupuesto_reasignar (SECURITY DEFINER en Aurora).'
- '[promesas] La bandeja /promesas (Server Component) hacia 2 consultas a Supabase (promesas activas tope 800 +
