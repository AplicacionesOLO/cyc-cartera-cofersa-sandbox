- '[reportes] Server Components resumen-ejecutivo y cierre-mensual: las 5 / 9 consultas paralelas pasan a UN endpoint
  agregado cada uno, con los datos crudos de la misma forma; el cálculo de KPIs/tops sigue en page.tsx. Las ventanas
  de fechas ICP del cierre se calculan en el backend (GetCierreMensualUseCase).'
- '[reportes] estados-cuenta/page.tsx: enriquecimiento con vendedor del código representativo se hace en el backend;
  filtro ''por analista'' usa analistasConCarteraReal (GET /me/analistas-con-cartera). El envío/descarga por cliente
