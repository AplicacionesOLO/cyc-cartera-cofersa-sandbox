database_objects:
  naming_map: database/naming-map.json
  generation_report: database/generation-report.json
environment_variables:
  backend:
  - ENVIRONMENT
  - SERVICE_NAME
  - LOG_LEVEL
  - DB_SECRET_NAME
  - DB_NAME
  - DB_PROXY_ENDPOINT
  - DB_PORT
  - DB_SSLMODE
  - ALLOWED_ORIGINS
  frontend:
  - NEXT_PUBLIC_API_BASE_URL
  - NEXT_PUBLIC_COGNITO_USER_POOL_ID
  - NEXT_PUBLIC_COGNITO_CLIENT_ID
  - NEXT_PUBLIC_COGNITO_DOMAIN
  - NEXT_PUBLIC_APP_EXPOSURE
  - NEXT_PUBLIC_REALTIME_ENABLED
authorization_rules:
- table: public.pagos
  policy: pagos_select_usuarios_activos
  command: SELECT
  enforced_in: 'GetRankingClientesUseCase / GetPerfilVendedorUseCase / GetAlertasDeterioroUseCase (require_usuario
    + scope_email: ANALISTA o ANALISTA_RIESGO con cartera solo su email), GetConcentracionUseCase (require_usuario;
    ForbiddenError para quien gestiona cartera propia), GetPagosMesResumenUseCase (require_roles COORDINADOR|GERENCIA)'
  roles:
  - public
  using: "(EXISTS ( SELECT 1\n   FROM usuarios\n  WHERE ((usuarios.email = (auth.jwt() ->> 'email'::text)) AND (usuarios.activo\
    \ = true))))"
  with_check: null
- table: public.pagos
  policy: pagos_write_coordinador
  command: ALL
  enforced_in: 'Sin escrituras desde la API: tbl_pagos solo la escribe la sincronización (fn_sync_pagos / módulo
    jobs). Este módulo solo lee pagos vía fn_* SECURITY DEFINER.'
  roles:
  - public
  using: "(EXISTS ( SELECT 1\n   FROM usuarios\n  WHERE ((usuarios.email = (auth.jwt() ->> 'email'::text)) AND (usuarios.rol\
    \ = 'COORDINADOR'::text) AND (usuarios.activo = true))))"
  with_check: null
- table: public.pagos_anulados
  policy: Solo coordinador accede a pagos_anulados
  command: ALL
  enforced_in: 'MarcarPagosAnuladosUseCase / DesmarcarPagoAnuladoUseCase (require_usuario + require_coordinador,
    ''Acceso restringido al coordinador''); la lectura solo ocurre dentro de fn_pagos_mes_resumen (GetPagosMesResumenUseCase:
    COORDINADOR|GERENCIA)'
  roles:
  - public
  using: "(EXISTS ( SELECT 1\n   FROM usuarios\n  WHERE ((usuarios.email = (auth.jwt() ->> 'email'::text)) AND (usuarios.rol\
    \ = 'COORDINADOR'::text) AND (usuarios.activo = true))))"
  with_check: null
- table: public.pagos_duplicado_descartado
  policy: Solo coordinador accede a pagos_duplicado_descartado
  command: ALL
  enforced_in: 'DescartarDuplicadoUseCase / RevertirDescarteDuplicadoUseCase (require_usuario + require_coordinador);
    la lectura solo ocurre dentro de fn_pagos_mes_resumen (GetPagosMesResumenUseCase: COORDINADOR|GERENCIA)'
  roles:
  - public
  using: "(EXISTS ( SELECT 1\n   FROM usuarios\n  WHERE ((usuarios.email = (auth.jwt() ->> 'email'::text)) AND (usuarios.rol\
    \ = 'COORDINADOR'::text) AND (usuarios.activo = true))))"
  with_check: null
- table: public.garantias
  policy: garantias_select_activos
  command: SELECT
  enforced_in: List/Get*UseCase de auditoria_legal (require_modulo = require_usuario activo; ANALISTA_RIESGO 403)
  roles:
  - public
  using: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
  with_check: null
- table: public.garantias
  policy: garantias_insert_activos
  command: INSERT
  enforced_in: 'RegistrarGarantiaUseCase (require_escritura_modulo: usuario activo, no ANALISTA_RIESGO, no GERENCIA)'
  roles:
  - public
  using: null
  with_check: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
- table: public.garantias
  policy: garantias_update_activos
  command: UPDATE
  enforced_in: EditarGarantiaUseCase, CambiarCustodiaGarantiaUseCase, AdjuntarDocumentoGarantiaUseCase, GenerarPagareUseCase,
    RegistrarGarantiaUseCase (sustitución) — require_escritura_modulo
  roles:
  - public
  using: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
  with_check: null
- table: public.garantia_eventos
  policy: garantia_eventos_select_activos
  command: SELECT
  enforced_in: ListEventosGarantiaUseCase (require_modulo)
  roles:
  - public
  using: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
  with_check: null
- table: public.garantia_eventos
  policy: garantia_eventos_insert_activos
  command: INSERT
  enforced_in: Use cases de escritura de garantías (require_escritura_modulo); usuario_id = perfil del principal
  roles:
  - public
  using: null
  with_check: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
- table: public.garantias_consecutivo_anual
  policy: garantias_consecutivo_anual_bloqueada
  command: ALL
  enforced_in: 'Sin acceso directo: solo fn_siguiente_consecutivo_garantia desde RegistrarGarantiaUseCase (repository)'
  roles:
  - public
  using: 'false'
  with_check: 'false'
- table: public.personas_legales
  policy: personas_legales_select_activos
  command: SELECT
  enforced_in: ListPersonasLegalesUseCase (require_modulo)
  roles:
  - public
  using: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
  with_check: null
- table: public.personas_legales
  policy: personas_legales_insert_activos
  command: INSERT
  enforced_in: GenerarPagareUseCase y GestionarSolicitudActualizacionUseCase APROBAR (require_escritura_modulo)
  roles:
  - public
  using: null
  with_check: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
- table: public.personas_legales
  policy: personas_legales_update_activos
  command: UPDATE
  enforced_in: GenerarPagareUseCase y GestionarSolicitudActualizacionUseCase APROBAR (upsert, require_escritura_modulo)
  roles:
  - public
  using: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
  with_check: null
- table: public.solicitudes_actualizacion
  policy: solicitudes_actualizacion_select_activos
  command: SELECT
  enforced_in: 'ListSolicitudesActualizacionUseCase, GetSolicitudActualizacionUseCase (require_modulo); portal público:
    solo por SHA-256 del token vigente (ValidarTokenActualizacionUseCase)'
  roles:
  - public
  using: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
  with_check: null
- table: public.solicitudes_actualizacion
  policy: solicitudes_actualizacion_insert_activos
  command: INSERT
  enforced_in: CrearSolicitudActualizacionUseCase (require_escritura_modulo + límite 30/hora por usuario)
  roles:
  - public
  using: null
  with_check: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
- table: public.solicitudes_actualizacion
  policy: solicitudes_actualizacion_update_activos
  command: UPDATE
  enforced_in: GestionarSolicitudActualizacionUseCase (require_escritura_modulo); EnviarActualizacionPerfilUseCase
    (token vigente + CAS estado ENVIADA)
  roles:
  - public
  using: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
  with_check: null
- table: storage.objects
  policy: usuarios_activos_suben_garantias_legal
  command: INSERT
  enforced_in: CrearUploadDocumentoGarantiaUseCase (require_escritura_modulo antes de firmar la URL PUT; key generada
    por el backend `<id>_<ms>.pdf`, PDF ≤4MB)
  roles:
  - authenticated
  using: null
  with_check: ((bucket_id = 'garantias-legal'::text) AND fn_es_usuario_activo())
- table: public.centro_recursos_aplicaciones
  policy: authenticated_read_aplicaciones
  command: SELECT
  enforced_in: GetCentroRecursosUseCase / ListAplicacionesUseCase (require_usuario = usuario activo); escritura
    solo CrearAplicacionUseCase / ActualizarAplicacionUseCase (require_coordinador, rol real)
  roles:
  - authenticated
  using: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
  with_check: null
- table: public.centro_recursos_documentos
  policy: authenticated_read_documentos
  command: SELECT
  enforced_in: GetCentroRecursosUseCase / ListDocumentosUseCase (require_usuario = usuario activo); escritura solo
    CrearUrlCargaDocumentoUseCase / CrearDocumentoUseCase (require_coordinador)
  roles:
  - authenticated
  using: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
  with_check: null
- table: public.marcas
  policy: authenticated_read_marcas
  command: SELECT
  enforced_in: GetCentroRecursosUseCase (require_usuario = usuario activo); escritura solo CrearMarcaUseCase / ActualizarMarcaUseCase
    (require_coordinador)
  roles:
  - authenticated
  using: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
  with_check: null
- table: public.cartera
  policy: cartera_select_autenticados
  command: SELECT
  enforced_in: 'ListClientesUseCase / GetFichaClienteUseCase (require_usuario: usuario activo; sin scope por analista,
    igual que el origen)'
  roles:
  - authenticated
  using: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
  with_check: null
- table: public.cuentas_bancarias
  policy: authenticated_read_cuentas_bancarias
  command: SELECT
  enforced_in: GetEstadoCuentaDataUseCase / EnviarEstadoCuentaUseCase (require_usuario)
  roles:
  - authenticated
  using: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
  with_check: null
- table: public.facturas
  policy: facturas_select_usuarios_activos
  command: SELECT
  enforced_in: GetFichaClienteUseCase / BuscarGlobalUseCase / GetEstadoCuentaDataUseCase / EnviarEstadoCuentaUseCase
    (require_usuario)
  roles:
  - authenticated
  using: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
  with_check: null
- table: public.historico_aging_factura
  policy: solo_usuarios_activos
  command: ALL
  enforced_in: Sin uso en el alcance de clientes; quien la lea (reportes/jobs) debe exigir require_usuario. Escrituras
    solo por jobs (service_role)
  roles:
  - authenticated
  using: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
  with_check: null
- table: public.historico_cartera
  policy: read_historico_cartera
  command: SELECT
  enforced_in: 'Sin uso en el alcance de clientes (la leen dashboard/reportes: require_usuario en sus casos de uso)'
  roles:
  - authenticated
  using: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
  with_check: null
- table: public.maestro_clientes
  policy: maestro_clientes_select_autenticados
  command: SELECT
  enforced_in: ListClientesUseCase / BuscarGlobalUseCase / GetFichaClienteUseCase / GetEstadoCuentaDataUseCase (require_usuario)
  roles:
  - authenticated
  using: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
  with_check: null
- table: public.maestro_clientes
  policy: maestro_clientes_update_autenticados
  command: UPDATE
  enforced_in: 'ActualizarContactoClienteUseCase / ActualizarLogisticaClienteUseCase (_require_editor_cliente: COORDINADOR
    o analista_email = usuario) y CambiarEstadoClienteUseCase (require_coordinador)'
  roles:
  - authenticated
  using: "((( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo) AND (analista_email = (auth.jwt() ->> 'email'::text)))\
    \ OR (EXISTS ( SELECT 1\n   FROM usuarios\n  WHERE ((usuarios.email = (auth.jwt() ->> 'email'::text)) AND (usuarios.rol\
    \ = 'COORDINADOR'::text) AND (usuarios.activo = true)))))"
  with_check: "((( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo) AND (analista_email = (auth.jwt() ->>\
    \ 'email'::text))) OR (EXISTS ( SELECT 1\n   FROM usuarios\n  WHERE ((usuarios.email = (auth.jwt() ->> 'email'::text))\
    \ AND (usuarios.rol = 'COORDINADOR'::text) AND (usuarios.activo = true)))))"
- table: public.config_audit_log
  policy: Solo coordinador accede al log
  command: ALL
  enforced_in: ListAuditLogUseCase / GetConfiguracionPantallaUseCase (require_usuario + require_coordinador); las
    escrituras solo vía registrar_auditoria() dentro de casos de uso de coordinador
  roles:
  - public
  using: "(EXISTS ( SELECT 1\n   FROM usuarios\n  WHERE ((usuarios.email = (auth.jwt() ->> 'email'::text)) AND (usuarios.rol\
    \ = 'COORDINADOR'::text) AND (usuarios.activo = true))))"
  with_check: null
- table: public.config_sistema
  policy: config_sistema_select_usuarios_activos
  command: SELECT
  enforced_in: 'Get{Parametros,Semaforo,Sla,Automatizaciones}UseCase y GetConfiguracionPantallaUseCase (require_usuario
    activo + require_coordinador, más estricto que la política: en el origen estas lecturas también exigían COORDINADOR
    vía checkCoordinador); escrituras: Update{Parametro,Semaforo,Sla}UseCase / ToggleAutomatizacionUseCase (solo
    coordinador)'
  roles:
  - authenticated
  using: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
  with_check: null
- table: public.directorio_empresa
  policy: Coordinador gestiona directorio
  command: ALL
  enforced_in: ListDirectorioUseCase, CreateContactoUseCase, UpdateContactoUseCase, DeactivateContactoUseCase (require_usuario
    + require_coordinador)
  roles:
  - public
  using: "(EXISTS ( SELECT 1\n   FROM usuarios\n  WHERE ((usuarios.email = (auth.jwt() ->> 'email'::text)) AND (usuarios.rol\
    \ = 'COORDINADOR'::text) AND (usuarios.activo = true))))"
  with_check: null
- table: public.directorio_empresa
  policy: Todos leen directorio para autocomplete
  command: SELECT
  enforced_in: ListContactosDirectorioUseCase (require_usuario activo; solo contactos activos y columnas id, nombre,
    email, cargo, area)
  roles:
  - public
  using: "(EXISTS ( SELECT 1\n   FROM usuarios\n  WHERE ((usuarios.email = (auth.jwt() ->> 'email'::text)) AND (usuarios.activo\
    \ = true))))"
  with_check: null
- table: public.portafolio_acotado
  policy: solo_usuarios_activos
  command: ALL
  enforced_in: ListRutasUseCase, CreateRutaUseCase, UpdateRutaUseCase, DeactivateRutaUseCase, GetConfiguracionPantallaUseCase
    (require_usuario activo + require_coordinador; en el origen se escribía con service_role tras checkCoordinador)
  roles:
  - authenticated
  using: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
  with_check: null
- table: public.portafolio_grupos
  policy: solo_usuarios_activos
  command: ALL
  enforced_in: ListRutasUseCase, CreateRutaUseCase, UpdateRutaUseCase, DeactivateRutaUseCase, UpdateVendedorUseCase/DeactivateVendedorUseCase
    (lectura de ruta activa) (require_usuario activo + require_coordinador)
  roles:
  - authenticated
  using: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
  with_check: null
- table: public.supervisores
  policy: Analistas leen supervisores
  command: SELECT
  enforced_in: ListSupervisoresConfigUseCase / ListVendedoresConfigUseCase / GetConfiguracionPantallaUseCase (require_usuario
    activo + require_coordinador; las lecturas de supervisores de otros módulos aplican require_usuario en su propio
    caso de uso)
  roles:
  - public
  using: "(EXISTS ( SELECT 1\n   FROM usuarios\n  WHERE ((usuarios.email = (auth.jwt() ->> 'email'::text)) AND (usuarios.activo\
    \ = true))))"
  with_check: null
- table: public.supervisores
  policy: Coordinador gestiona supervisores
  command: ALL
  enforced_in: CreateSupervisorUseCase, UpdateSupervisorUseCase, DeactivateSupervisorUseCase (require_usuario +
    require_coordinador)
  roles:
  - public
  using: "(EXISTS ( SELECT 1\n   FROM usuarios\n  WHERE ((usuarios.email = (auth.jwt() ->> 'email'::text)) AND (usuarios.rol\
    \ = 'COORDINADOR'::text) AND (usuarios.activo = true))))"
  with_check: null
- table: public.usuarios
  policy: usuarios_select_autenticados
  command: SELECT
  enforced_in: 'ListUsuariosConfigUseCase / GetConfiguracionPantallaUseCase (require_usuario activo + require_coordinador;
    nunca devuelve google_refresh_token); altas/ediciones: CreateUsuarioUseCase / UpdateUsuarioUseCase (solo coordinador,
    antes service_role)'
  roles:
  - authenticated
  using: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
  with_check: null
- table: public.vendedores
  policy: Analistas leen vendedores
  command: SELECT
  enforced_in: ListVendedoresConfigUseCase / ListRutasUseCase / GetConfiguracionPantallaUseCase (require_usuario
    activo + require_coordinador)
  roles:
  - public
  using: "(EXISTS ( SELECT 1\n   FROM usuarios\n  WHERE ((usuarios.email = (auth.jwt() ->> 'email'::text)) AND (usuarios.activo\
    \ = true))))"
  with_check: null
- table: public.vendedores
  policy: Coordinador gestiona vendedores
  command: ALL
  enforced_in: CreateVendedorUseCase, UpdateVendedorUseCase, DeactivateVendedorUseCase (require_usuario + require_coordinador)
  roles:
  - public
  using: "(EXISTS ( SELECT 1\n   FROM usuarios\n  WHERE ((usuarios.email = (auth.jwt() ->> 'email'::text)) AND (usuarios.rol\
    \ = 'COORDINADOR'::text) AND (usuarios.activo = true))))"
  with_check: null
- table: public.pedidos_retenidos
  policy: pedidos_retenidos_select_activos
  command: SELECT
  enforced_in: 'GetPedidosRetenidosUseCase (require_usuario: cualquier usuario activo; email opcional = Vista Global)'
  roles:
  - public
  using: ( SELECT fn_es_usuario_activo() AS fn_es_usuario_activo)
  with_check: null
- table: public.pedidos_retenidos
  policy: pedidos_retenidos_update_activos
