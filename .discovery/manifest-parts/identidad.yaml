authorization_rules: []
structural_changes:
  - "Supabase Auth (Google OAuth) → Cognito User Pool con Google como IdP federado (Hosted UI). El acceso real
     sigue dado por tener fila activa en `usuarios` (GET /me responde 403 acceso_denegado si no), igual que
     el layout original + /auth/denegado. El primer login vincula el sub de Cognito con tbl_app_users por
     email verificado (mismos ids que auth.users)."
  - "Gmail/Calendar: Supabase entregaba provider_token/provider_refresh_token de Google en la sesión;
     Cognito no los expone. Se agregó un consentimiento de Google propio (/me/google/authorize-url →
     /auth/google → /me/google/connect) que guarda el refresh token en usuarios.google_refresh_token (la
     misma columna que ya usaba /auth/callback). Los envíos de correo se hacen en el backend con ese
     refresh token (UsuarioMailer). Los refresh tokens existentes siguen sirviendo si se usa el mismo
     cliente OAuth de Google (google_client_id/secret)."
  - "'Ver como': la cookie sic_ver_como la fija ahora el navegador (no httpOnly) después de que
     POST /me/preview-rol valida que el rol real es COORDINADOR. Solo cambia qué se renderiza; el API
     autoriza siempre con el rol real (igual que el original)."
  - "Layout: totalEquipo y última sincronización vienen en GET /me (antes 2 consultas con service_role y
     unstable_cache)."
  - "Server Components llaman al API Gateway con el ID token de la sesión (cookies de Amplify,
     @aws-amplify/adapter-nextjs); nunca a la base."
incompatibilities:
  - "Login silencioso de Google (login_hint + prompt=none desde la app): el Hosted UI de Cognito no permite
     pasar esos parámetros al IdP; el usuario hace clic en 'Ingresar con Google' (Cognito recuerda la
     sesión del IdP)."
  - "Login correo/contraseña: en Supabase existía para cuentas no-Google; en Cognito requiere crear esos
     usuarios en el User Pool (las contraseñas de Supabase no se pueden migrar)."
migration_risks:
  - "Si el cliente OAuth de Google usado por el backend no es el mismo que emitió los refresh tokens
     guardados, todos los usuarios deberán volver a autorizar Gmail (lo hace solo el flujo de /auth/callback)."
