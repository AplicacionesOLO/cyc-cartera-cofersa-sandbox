              GetNuevaSolicitudContextoUseCase, ListFacturasPendientesUseCase, CreateAdjuntoUploadUrlUseCase,
              CreateSolicitudUseCase, ResolverSolicitudUseCase, CambiarEstadoSolicitudUseCase,
              AgregarComentarioSolicitudUseCase]
