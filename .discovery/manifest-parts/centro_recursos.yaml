     handler: entrypoints.lambda_handlers.centro_recursos.centro_recursos_handler, use_case: GetCentroRecursosUseCase,
     module: centro_recursos, auth: cognito, timeout: 29,
     source: ["src/app/(app)/centro-recursos/page.tsx:27", "src/app/(app)/centro-recursos/page.tsx:32",
              "src/app/(app)/centro-recursos/page.tsx:34", "src/app/(app)/centro-recursos/page.tsx:36",
              "src/app/(app)/centro-recursos/page.tsx:40", "src/app/(app)/centro-recursos/page.tsx:45",
              "src/app/(app)/centro-recursos/page.tsx:47", "src/app/(app)/centro-recursos/page.tsx:49",
              "src/app/(app)/centro-recursos/page.tsx:51"]}
  - {method: GET, path: /centro-recursos/aplicaciones, function: CentroRecursosApi,
     handler: entrypoints.lambda_handlers.centro_recursos.centro_recursos_handler, use_case: ListAplicacionesUseCase,
     module: centro_recursos, auth: cognito,
     source: ["src/app/api/centro-recursos/aplicaciones/route.ts:6"]}
