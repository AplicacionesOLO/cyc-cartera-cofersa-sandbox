     use_case: ActualizarAplicacionUseCase, module: centro_recursos, auth: cognito,
     source: ["src/app/api/centro-recursos/aplicaciones/[id]/route.ts:7",
              "src/components/centro-recursos/ModalEditarAplicacion.tsx:25",
              "src/components/centro-recursos/TabAplicaciones.tsx:167",
              "src/components/centro-recursos/TabAplicaciones.tsx:170"]}
  - {method: GET, path: /centro-recursos/documentos, function: CentroRecursosApi,
     handler: entrypoints.lambda_handlers.centro_recursos.centro_recursos_handler, use_case: ListDocumentosUseCase,
     module: centro_recursos, auth: cognito,
     source: ["src/app/api/centro-recursos/documentos/route.ts:8"]}
  - {method: POST, path: /centro-recursos/documentos/upload-url, function: CentroRecursosApi,
     handler: entrypoints.lambda_handlers.centro_recursos.centro_recursos_handler,
     use_case: CrearUrlCargaDocumentoUseCase, module: centro_recursos, auth: cognito,
     source: ["src/app/api/centro-recursos/documentos/route.ts:52"]}
  - {method: POST, path: /centro-recursos/documentos, function: CentroRecursosApi,
     handler: entrypoints.lambda_handlers.centro_recursos.centro_recursos_handler, use_case: CrearDocumentoUseCase,
     module: centro_recursos, auth: cognito,
     source: ["src/app/api/centro-recursos/documentos/route.ts:25",
              "src/app/api/centro-recursos/documentos/route.ts:58",
              "src/components/centro-recursos/ModalCargarDocumento.tsx:35"]}
  - {method: POST, path: /centro-recursos/marcas, function: CentroRecursosApi,
     handler: entrypoints.lambda_handlers.centro_recursos.centro_recursos_handler, use_case: CrearMarcaUseCase,
     module: centro_recursos, auth: cognito,
     source: ["src/app/api/centro-recursos/marcas/route.ts:5",
              "src/components/centro-recursos/ModalAgregarMarca.tsx:34"]}
  - {method: PUT, path: "/centro-recursos/marcas/{id}", function: CentroRecursosApi,
     handler: entrypoints.lambda_handlers.centro_recursos.centro_recursos_handler, use_case: ActualizarMarcaUseCase,
     module: centro_recursos, auth: cognito,
     source: ["src/app/api/centro-recursos/marcas/[id]/route.ts:8",
              "src/components/centro-recursos/TabDirectorioAgentes.tsx:105",
              "src/components/centro-recursos/TabDirectorioAgentes.tsx:134"]}
storage_buckets: [{name: documentos-recursos, functions: [CentroRecursosApi]}]
authorization_rules:
  - {table: public.centro_recursos_aplicaciones, policy: authenticated_read_aplicaciones, command: SELECT,
     enforced_in: "GetCentroRecursosUseCase / ListAplicacionesUseCase (require_usuario = usuario activo); escritura solo CrearAplicacionUseCase / ActualizarAplicacionUseCase (require_coordinador, rol real)"}
  - {table: public.centro_recursos_documentos, policy: authenticated_read_documentos, command: SELECT,
     enforced_in: "GetCentroRecursosUseCase / ListDocumentosUseCase (require_usuario = usuario activo); escritura solo CrearUrlCargaDocumentoUseCase / CrearDocumentoUseCase (require_coordinador)"}
  - {table: public.marcas, policy: authenticated_read_marcas, command: SELECT,
     enforced_in: "GetCentroRecursosUseCase (require_usuario = usuario activo); escritura solo CrearMarcaUseCase / ActualizarMarcaUseCase (require_coordinador)"}
scheduled_jobs: []
async_workers: []
structural_changes:
  - "El Server Component /centro-recursos hacía 9 consultas en paralelo con service_role; ahora llama a UN endpoint agregado GET /centro-recursos que devuelve las mismas filas crudas (vendedores, supervisores, usuarios, documentos, aplicaciones, grupos, miembros, directorio, marcas). El armado del directorio/árbol/compradores sigue en el page.tsx sin cambios."
  - "Carga de documentos: antes multipart/form-data a la API Route que subía a Storage; ahora 2 pasos: POST /centro-recursos/documentos/upload-url (URL prefirmada PUT, key `${ms}_${nombre_saneado}` como el path original) → uploadToPresignedUrl → POST /centro-recursos/documentos {key, titulo, descripcion, categoria}, que valida que el objeto exista y registra la fila + auditoría."
  - "Bucket documentos-recursos pasa de público (getPublicUrl) a privado: en BD (columna url) se guarda la key del objeto y al leer se devuelve una URL prefirmada GET (1 h) en el mismo campo `url`. Filas migradas con la URL pública de Supabase se resuelven extrayendo la key después de '/documentos-recursos/'; enlaces externos se devuelven tal cual."
  - "checkCoordinador + insertAuditLog (src/lib/configuracion/admin.ts) se reimplementan en los casos de uso (require_coordinador con el rol real) y en PostgresCentroRecursosRepository.registrar_auditoria (tbl_config_audit_log dentro de un SAVEPOINT para que un fallo de auditoría no aborte la operación, igual que el try/catch original)."
  - "Los componentes (modales, TabAplicaciones, TabDirectorioAgentes) usan useCentroRecursosController (src/views/centro-recursos/hooks); TabAplicaciones usa useHaciendaController (módulo notificaciones) para Hacienda/CABYS."
incompatibilities:
  - "Las URLs de documentos ya no son permanentes: caducan a la hora. Si el usuario deja la pantalla abierta más de 1 h, el enlace de descarga expira y debe recargar la página."
  - "Errores de base de datos que antes devolvían error.message de PostgREST (500) ahora devuelven el mensaje genérico del adaptador (500) o el de translate_db_error (p. ej. FK inválida de comprador → 409)."
  - "PUT /centro-recursos/aplicaciones/{id} sin campos editables devuelve la fila actual (en el origen el update vacío de PostgREST era indefinido)."
migration_risks:
  - "Los objetos existentes del bucket documentos-recursos de Supabase deben copiarse a S3 con la MISMA key (path después de /documentos-recursos/); database/data_migration.sh no cubre Storage. Si no se copian, los documentos migrados devolverán URLs prefirmadas a objetos inexistentes (403/404 de S3)."
  - "El CORS del bucket S3 documentos-recursos debe permitir PUT desde el origen del frontend (subida prefirmada) con header Content-Type."
pending:
  - "Infra/SAM: bucket documentos-recursos privado + variable DOCUMENTOS_RECURSOS_BUCKET_NAME + permisos s3:PutObject/GetObject/HeadObject para CentroRecursosApi (ya previsto en container.storage)."
  - "Copia de objetos Storage → S3 del bucket documentos-recursos en la migración de datos (ver migration_risks)."
