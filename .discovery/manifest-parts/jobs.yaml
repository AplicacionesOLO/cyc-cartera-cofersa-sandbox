authorization_rules:
- table: public.pagos_stage
  policy: solo_usuarios_activos
  command: ALL
  enforced_in: IngestarLoteUseCase (x-ingesta-key, service_role) + EjecutarTareaProgramadaUseCase / ProcesarSyncManualUseCase
    (service_role vía fn_sync_pagos); ningún endpoint de usuario lee ni escribe el stage
- table: public.pedidos_retenidos_stage
  policy: pedidos_retenidos_stage_activos
  command: ALL
  enforced_in: IngestarLoteUseCase (x-ingesta-key, service_role) + EjecutarTareaProgramadaUseCase / ProcesarSyncManualUseCase
    (service_role vía fn_sync_pedidos_retenidos); ningún endpoint de usuario lo expone
- table: public.sync_log
  policy: sync_log_insert_usuarios_activos
  command: INSERT
  enforced_in: 'Solo las fn_sync_* insertan (SECURITY DEFINER): SincronizarTablaUseCase / EncolarSyncManualUseCase
    (require_usuario + require_coordinador) y jobs programados (service_role); no hay INSERT directo desde el API'
- table: public.sync_log
  policy: sync_log_select_usuarios_activos
  command: SELECT
  enforced_in: 'ListarHistorialSyncUseCase / ObtenerEstadoSyncUseCase (require_usuario: usuario activo)'
- table: public.sync_salud
  policy: Solo coordinador lee sync_salud
  command: SELECT
  enforced_in: Sin endpoint de lectura (el front original no la consultaba); solo la usa fn_check_sync_salud desde
    el job check-sync-salud (service_role). Un futuro GET debe usar require_coordinador
