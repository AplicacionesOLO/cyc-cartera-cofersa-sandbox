storage_buckets: []
authorization_rules:
  - {table: public.historico_bloqueados, policy: solo_usuarios_activos, command: ALL, enforced_in: "GetBloqueadosUseCase (require_usuario + roles mora-vendedor; el INSERT via fn_snapshot_bloqueados_semana solo si el usuario real es COORDINADOR)"}
  - {table: public.historico_cierres_cartera, policy: solo_usuarios_activos, command: ALL, enforced_in: "TomarCierreCarteraUseCase (require_usuario + roles cei + require_escritura) / GetCeiUseCase, GetMigracionMoraUseCase (require_usuario + roles del registry, lectura via fn_reporte_*)"}
  - {table: public.historico_pedidos_retenidos, policy: historico_pedidos_retenidos_select_activos, command: SELECT, enforced_in: "Sin acceso directo desde el front de reportes; solo lo leen fn_* SECURITY DEFINER invocadas tras require_usuario (GetCierreMensualUseCase y demás casos de uso del módulo)"}
  - {table: public.ventas_mensuales, policy: Coordinador gestiona ventas mensuales, command: ALL, enforced_in: "El módulo reportes no escribe ventas_mensuales (solo lectura); escritura no expuesta por ReportesApi"}
  - {table: public.ventas_mensuales, policy: Todos leen ventas mensuales, command: SELECT, enforced_in: "GetResumenEjecutivoUseCase (require_usuario + roles resumen-ejecutivo COORDINADOR/GERENCIA)"}
scheduled_jobs: []
async_workers: []
structural_changes:
  - "Roles por reporte de src/lib/reportes/registry.ts replicados en domain/entities/reportes.py (REPORTE_ROLES) y aplicados en cada caso de uso (antes solo redirect en page.tsx; las RPC SECURITY DEFINER respondían a cualquier usuario activo). Los reportes exclusivos de ANALISTA (gestiones-periodo, cartera-vencida) también admiten COORDINADOR para 'Ver como' y siempre se acotan al email del propio usuario."
  - "Scope por analista en backend: mora-vendedor, bloqueados, plazo-especial y estados-cuenta usan analista_scope (un ANALISTA / ANALISTA_RIESGO con cartera siempre queda limitado a su email aunque mande otro)."
  - "Server Components resumen-ejecutivo y cierre-mensual: las 5 / 9 consultas paralelas pasan a UN endpoint agregado cada uno, con los datos crudos de la misma forma; el cálculo de KPIs/tops sigue en page.tsx. Las ventanas de fechas ICP del cierre se calculan en el backend (GetCierreMensualUseCase)."
  - "estados-cuenta/page.tsx: enriquecimiento con vendedor del código representativo se hace en el backend; filtro 'por analista' usa analistasConCarteraReal (GET /me/analistas-con-cartera). El envío/descarga por cliente usa clientesApi (/clientes/estado-cuenta[/data], módulo clientes)."
  - "cartera-vencida: maestro + cartera + última gestión en una sola consulta SQL (subselect max(fecha))."
  - "DimensionFilter, VendedorEnvioPanel, detalle-bloqueados, resumen-ejecutivo-cliente: datos y envío vía hooks de src/views/reportes/hooks; ya no se manda providerToken."
  - "Borrada src/app/api/reportes/enviar/route.ts → POST /reportes/enviar (UsuarioMailer, adjunto base64 → EmailAttachment)."
incompatibilities:
  - "POST /reportes/enviar: el origen respondía 200 {ok:false, email_sent:false, error} si Gmail fallaba; ahora el fallo de Gmail es 422 (BusinessRuleViolation) y el front muestra ApiError.message. En éxito se mantiene {ok:true, email_sent:true, to}. Sin refresh token de Gmail el mensaje es el de UsuarioMailer (antes 'Sesión de Google expirada...')."
  - "Cierre manual del CEI (fn_snapshot_cierre_cartera): antes cualquier usuario activo (incluida GERENCIA) podía dispararlo; ahora require_escritura → solo COORDINADOR (GERENCIA recibe 403 y ve el alert 'No se pudo guardar el cierre de cartera.')."
  - "resumen-ejecutivo / cierre-mensual: el origen degradaba por consulta (Promise.allSettled / errores ignorados); ahora si el endpoint agregado falla la página muestra un mensaje de error (regla 8) en vez de datos parciales."
  - "Snapshot semanal de bloqueados: se ejecuta en una transacción propia; si falla (DomainError) se ignora igual que el origen."
migration_risks:
  - "historico_cartera se sigue leyendo ORDER BY fecha ASC LIMIT 90 (comportamiento original: las 90 filas más antiguas); con >90 días de histórico la tendencia del resumen ejecutivo no muestra lo más reciente."
  - "Adjuntos base64 en POST /reportes/enviar: límite de payload de Lambda (6 MB) / API Gateway (10 MB); adjuntos grandes fallarán."
  - "maestro_clientes completo (~1.5k filas) viaja en GET /reportes/cierre-mensual; crecer mucho afecta la latencia (límite 29 s)."
  - "PostgREST limitaba a 1000 filas las consultas directas (cartera-vencida, gestiones-periodo); ahora no hay límite, resultados pueden ser mayores que antes."
pending:
  - "Módulo clientes: GET /clientes/estado-cuenta/data y POST /clientes/estado-cuenta deben aceptar el body sin providerToken y 'adjunto: null' (estados-cuenta-cliente.tsx los usa vía clientesApi)."
  - "src/views/reportes/hooks/use-remote-resource.ts duplica el de views/presupuesto (no se importa entre módulos); se puede mover a src/shared si el coordinador lo prefiere."
