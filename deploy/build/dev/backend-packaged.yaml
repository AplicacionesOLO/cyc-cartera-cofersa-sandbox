    Value: !Sub '${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
    Description: COGNITO_DOMAIN del frontend (Hosted UI)
  GoogleRedirectUri:
    Condition: CreateUserPool
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse'
    Description: URI de redirección autorizada a registrar en el cliente OAuth de Google
  ComprobantesPagoBucket:
    Value: !Ref 'ComprobantesPagoBucket'
    Description: Bucket S3 'comprobantes-pago'
