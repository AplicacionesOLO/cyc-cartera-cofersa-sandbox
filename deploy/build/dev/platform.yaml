      LogGroupName:
        Fn::Sub: /aws/lambda/${Environment}-${ProjectSlug}-service-hours
      RetentionInDays:
        Fn::If:
        - IsProduction
        - 30
        - 7
  ServiceHoursRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: service-hours
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: StartStopDatabase
            Effect: Allow
            Action:
            - rds:StartDBInstance
            - rds:StopDBInstance
            - rds:DescribeDBInstances
            Resource:
              Fn::Sub: arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:${DatabaseInstance}
          - Sid: ToggleProjectFunctions
            Effect: Allow
            Action:
            - lambda:PutFunctionConcurrency
            - lambda:DeleteFunctionConcurrency
            - lambda:GetFunctionConcurrency
            Resource:
              Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${Environment}-${ProjectSlug}-api-*
          - Sid: ListAppStackResources
            Effect: Allow
            Action:
            - cloudformation:ListStackResources
            Resource:
              Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Environment}-${ProjectSlug}-api/*
          - Sid: WriteLogs
            Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: ${ServiceHoursLogGroup.Arn}:*
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-service-hours-role
  ServiceHoursFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-${ProjectSlug}-service-hours
      Description:
        Fn::Sub: ${ProjectLabel} - horario de servicio (${ServiceTimezone})
      Runtime: python3.13
      Handler: index.handler
      MemorySize: 256
      Timeout: 120
      Role:
        Fn::GetAtt:
        - ServiceHoursRole
        - Arn
      Code:
        ZipFile: |
          """Horario de servicio: enciende y apaga los servicios del proyecto (EventBridge Scheduler -> esta Lambda).

          warmup: arranca RDS y el EC2 del frontend · start: habilita las Lambdas · stop: Lambdas a concurrencia 0,
          detiene el EC2 y RDS · status: estado actual. Solo toca la instancia RDS, el EC2 y las funciones del proyecto.
          """
          import json
          import os

          import boto3
          from botocore.exceptions import ClientError

          rds = boto3.client("rds")
          ec2 = boto3.client("ec2")
          lam = boto3.client("lambda")
          cfn = boto3.client("cloudformation")


          def functions():
              names = []
              for stack in filter(None, os.environ.get("APP_STACKS", "").split(",")):
                  try:
                      for page in cfn.get_paginator("list_stack_resources").paginate(StackName=stack):
                          names += [r["PhysicalResourceId"] for r in page["StackResourceSummaries"]
                                    if r["ResourceType"] == "AWS::Lambda::Function"]
                  except ClientError as error:
                      if "does not exist" not in str(error):
                          raise
              return names


          def db_status(db):
              return rds.describe_db_instances(DBInstanceIdentifier=db)["DBInstances"][0]["DBInstanceStatus"]


          def web_status(iid):
              return ec2.describe_instances(InstanceIds=[iid])["Reservations"][0]["Instances"][0]["State"]["Name"]


          def handler(event, context=None):
              action = (event or {}).get("action", "status")
              db = os.environ["DB_INSTANCE_ID"]
              web = os.environ.get("WEB_INSTANCE_ID", "")
              status = db_status(db)
              result = {"action": action, "db_before": status, "db": status, "functions": 0}
              if web:
                  result["web"] = web_status(web)
              db_error = None
              if action in ("warmup", "start"):
                  if status == "stopped":
                      # Sin capacidad en la AZ (InsufficientDBInstanceCapacity) no se frena el resto: se enciende lo demás
                      # y al final se lanza el error para que el Scheduler reintente.
                      try:
                          rds.start_db_instance(DBInstanceIdentifier=db)
                          result["db"] = "starting"
                      except ClientError as error:
                          db_error = error
                          result["db_error"] = error.response["Error"]["Code"]
                  if web and result["web"] == "stopped":
                      ec2.start_instances(InstanceIds=[web])
                      result["web"] = "pending"
              if action == "start":
                  for name in functions():
                      lam.delete_function_concurrency(FunctionName=name)
                      result["functions"] += 1
              elif action == "stop":
                  for name in functions():
                      lam.put_function_concurrency(FunctionName=name, ReservedConcurrentExecutions=0)
                      result["functions"] += 1
                  if web and result["web"] == "running":
                      ec2.stop_instances(InstanceIds=[web])
                      result["web"] = "stopping"
                  if status == "available":
                      rds.stop_db_instance(DBInstanceIdentifier=db)
                      result["db"] = "stopping"
              elif action == "status":
                  result["disabled"] = [n for n in functions()
                                        if lam.get_function_concurrency(FunctionName=n).get("ReservedConcurrentExecutions") == 0]
              print(json.dumps(result))
              if db_error:
                  raise db_error
              return result
      LoggingConfig:
        LogFormat: JSON
        LogGroup:
          Ref: ServiceHoursLogGroup
      Environment:
        Variables:
          DB_INSTANCE_ID:
            Ref: DatabaseInstance
          APP_STACKS:
            Fn::Sub: ${Environment}-${ProjectSlug}-api
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-service-hours
