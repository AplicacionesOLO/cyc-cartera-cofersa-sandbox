AWSTemplateFormatVersion: '2010-09-09'
Metadata:
  cfn-lint:
    config:
      ignore_checks:
      - W1030
Description: CYC_COFERSA - plataforma (red, RDS, secretos, SSM, Lambda+CloudFront, runner BD, horario)
Parameters:
  Environment:
    Type: String
    AllowedValues:
    - dev
    - qa
    - prod
  EnvironmentTag:
    Type: String
    AllowedValues:
    - DEV
    - QA
    - PROD
  ProjectSlug:
    Type: String
    Default: cyc-cofersa
    AllowedPattern: ^[a-z][a-z0-9-]{1,30}$
  ProjectLabel:
    Type: String
    Default: CYC_COFERSA
  DbName:
    Type: String
    Description: base del aplicativo (naming-map.json del ambiente)
  AppUser:
    Type: String
    Default: usr_cyc_cofersa_app
  ReportUser:
    Type: String
    Default: usr_cyc_cofersa_report
  DeployUser:
    Type: String
    Default: usr_cyc_cofersa_deploy
  DbaUser:
    Type: String
    Default: usr_cyc_cofersa_dba
  CreateNetwork:
    Type: String
    AllowedValues:
    - 'true'
    - 'false'
    Default: 'true'
  VpcCidr:
    Type: String
    Default: 10.40.0.0/16
  ExistingVpcId:
    Type: String
    Default: ''
  ExistingPrivateSubnetIds:
    Type: CommaDelimitedList
    Default: ''
  UseRdsProxy:
    Type: String
    AllowedValues:
    - 'true'
    - 'false'
    Default: 'false'
  DbEngineVersion:
    Type: String
    Default: '16.15'
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
  DbAvailabilityZone:
    Type: String
    Default: ''
  DbIdentifierSuffix:
    Type: String
    Default: ''
    AllowedPattern: ^[a-z0-9-]{0,10}$
  ServiceHoursEnabled:
    Type: String
    AllowedValues:
    - 'true'
    - 'false'
    Default: 'true'
  ServiceTimezone:
    Type: String
    Default: America/Costa_Rica
  ServiceWarmupCron:
    Type: String
    Default: cron(45 4 ? * * *)
  ServiceStartCron:
    Type: String
    Default: cron(0 5 ? * * *)
  ServiceStopCron:
    Type: String
    Default: cron(0 18 ? * * *)
  ServiceEnsureCron:
    Type: String
    Default: cron(0/15 5-17 ? * * *)
Conditions:
  IsProduction:
    Fn::Equals:
    - Ref: Environment
    - prod
  CreateVpc:
    Fn::Equals:
    - Ref: CreateNetwork
    - 'true'
  UseProxy:
    Fn::Equals:
    - Ref: UseRdsProxy
    - 'true'
  HasDbAz:
    Fn::Not:
    - Fn::Equals:
      - Ref: DbAvailabilityZone
      - ''
  HasServiceHours:
    Fn::Equals:
    - Ref: ServiceHoursEnabled
    - 'true'
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Condition: CreateVpc
    Properties:
      CidrBlock:
        Ref: VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-vpc
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateVpc
    Properties:
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-igw
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateVpc
    Properties:
      VpcId:
        Ref: Vpc
      InternetGatewayId:
        Ref: InternetGateway
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Condition: CreateVpc
    Properties:
      VpcId:
        Ref: Vpc
      AvailabilityZone:
        Fn::Select:
        - 0
        - Fn::GetAZs: ''
      CidrBlock:
        Fn::Select:
        - 0
        - Fn::Cidr:
          - Ref: VpcCidr
          - 4
          - 8
      MapPublicIpOnLaunch: false
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-public-a
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Condition: CreateVpc
    Properties:
      VpcId:
        Ref: Vpc
      AvailabilityZone:
        Fn::Select:
        - 1
        - Fn::GetAZs: ''
      CidrBlock:
        Fn::Select:
        - 1
        - Fn::Cidr:
          - Ref: VpcCidr
          - 4
          - 8
      MapPublicIpOnLaunch: false
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-public-b
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Condition: CreateVpc
    Properties:
      VpcId:
        Ref: Vpc
      AvailabilityZone:
        Fn::Select:
        - 0
        - Fn::GetAZs: ''
      CidrBlock:
        Fn::Select:
        - 2
        - Fn::Cidr:
          - Ref: VpcCidr
          - 4
          - 8
      MapPublicIpOnLaunch: false
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-private-a
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Condition: CreateVpc
    Properties:
      VpcId:
        Ref: Vpc
      AvailabilityZone:
        Fn::Select:
        - 1
        - Fn::GetAZs: ''
      CidrBlock:
        Fn::Select:
        - 3
        - Fn::Cidr:
          - Ref: VpcCidr
          - 4
          - 8
      MapPublicIpOnLaunch: false
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-private-b
  NatEip:
    Type: AWS::EC2::EIP
    Condition: CreateVpc
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-nat-eip
  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: CreateVpc
    Properties:
      SubnetId:
        Ref: PublicSubnetA
      AllocationId:
        Fn::GetAtt:
        - NatEip
        - AllocationId
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-nat
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateVpc
    Properties:
      VpcId:
        Ref: Vpc
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-public-rt
  PublicSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpc
    Properties:
      SubnetId:
        Ref: PublicSubnetA
      RouteTableId:
        Ref: PublicRouteTable
  PublicSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpc
    Properties:
      SubnetId:
        Ref: PublicSubnetB
      RouteTableId:
        Ref: PublicRouteTable
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateVpc
    Properties:
      VpcId:
        Ref: Vpc
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-private-rt
  PrivateSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpc
    Properties:
      SubnetId:
        Ref: PrivateSubnetA
      RouteTableId:
        Ref: PrivateRouteTable
  PrivateSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpc
    Properties:
      SubnetId:
        Ref: PrivateSubnetB
      RouteTableId:
        Ref: PrivateRouteTable
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateVpc
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId:
        Ref: PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: InternetGateway
  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateVpc
    Properties:
      RouteTableId:
        Ref: PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId:
        Ref: NatGateway
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateVpc
    Properties:
      VpcId:
        Ref: Vpc
      ServiceName:
        Fn::Sub: com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
      - Ref: PrivateRouteTable
  DynamodbGatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateVpc
    Properties:
      VpcId:
        Ref: Vpc
      ServiceName:
        Fn::Sub: com.amazonaws.${AWS::Region}.dynamodb
      VpcEndpointType: Gateway
      RouteTableIds:
      - Ref: PrivateRouteTable
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription:
        Fn::Sub: ${ProjectLabel} - Lambdas y runner de BD
      VpcId:
        Fn::If:
        - CreateVpc
        - Ref: Vpc
        - Ref: ExistingVpcId
      SecurityGroupEgress:
      - IpProtocol: '-1'
        CidrIp: 0.0.0.0/0
        Description: salida a AWS e Internet via NAT
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-lambda-sg
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription:
        Fn::Sub: ${ProjectLabel} - RDS PostgreSQL
      VpcId:
        Fn::If:
        - CreateVpc
        - Ref: Vpc
        - Ref: ExistingVpcId
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 5432
        ToPort: 5432
        SourceSecurityGroupId:
          Ref: LambdaSecurityGroup
        Description: Lambdas y runner de BD
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-db-sg
  ProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: UseProxy
    Properties:
      GroupDescription:
        Fn::Sub: ${ProjectLabel} - RDS Proxy
      VpcId:
        Fn::If:
        - CreateVpc
        - Ref: Vpc
        - Ref: ExistingVpcId
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 5432
        ToPort: 5432
        SourceSecurityGroupId:
          Ref: LambdaSecurityGroup
        Description: Lambdas
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-proxy-sg
  DatabaseIngressFromProxy:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseProxy
    Properties:
      GroupId:
        Ref: DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId:
        Ref: ProxySecurityGroup
      Description: RDS Proxy
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription:
        Fn::Sub: ${ProjectLabel} ${Environment} - subredes privadas
      SubnetIds:
        Fn::If:
        - CreateVpc
        - - Ref: PrivateSubnetA
          - Ref: PrivateSubnetB
        - Ref: ExistingPrivateSubnetIds
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-db-subnets
  DatabaseInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier:
        Fn::Sub: ${Environment}-${ProjectSlug}-rds${DbIdentifierSuffix}
      AvailabilityZone:
        Fn::If:
        - HasDbAz
        - Ref: DbAvailabilityZone
        - Ref: AWS::NoValue
      Engine: postgres
      EngineVersion:
        Ref: DbEngineVersion
      DBInstanceClass:
        Ref: DbInstanceClass
      AllocatedStorage:
        Ref: DbAllocatedStorage
      StorageType: gp3
      MasterUsername: dbmaster
      ManageMasterUserPassword: true
      StorageEncrypted: true
      CopyTagsToSnapshot: true
      MultiAZ: false
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod:
        Fn::If:
        - IsProduction
        - 14
        - 7
      DeletionProtection:
        Fn::If:
        - IsProduction
        - true
        - false
      DBSubnetGroupName:
        Ref: DatabaseSubnetGroup
      VPCSecurityGroups:
      - Ref: DatabaseSecurityGroup
      EnableCloudwatchLogsExports:
      - postgresql
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-rds
  AppDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: /${Environment}/${ProjectSlug}/db/app
      Description:
        Fn::Sub: ${ProjectLabel} ${Environment} - usuario de la aplicación (rw)
      GenerateSecretString:
        SecretStringTemplate:
          Fn::Sub: '{"username": "${AppUser}"}'
        GenerateStringKey: password
        PasswordLength: 32
        RequireEachIncludedType: true
        ExcludeCharacters: '"''`\/@ :;{}[]$&|<>'
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: /${Environment}/${ProjectSlug}/db/app
  ReportDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: /${Environment}/${ProjectSlug}/db/report
      Description:
        Fn::Sub: ${ProjectLabel} ${Environment} - usuario de reportes (ro)
      GenerateSecretString:
        SecretStringTemplate:
          Fn::Sub: '{"username": "${ReportUser}"}'
        GenerateStringKey: password
        PasswordLength: 32
        RequireEachIncludedType: true
        ExcludeCharacters: '"''`\/@ :;{}[]$&|<>'
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: /${Environment}/${ProjectSlug}/db/report
  DeployDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: /${Environment}/${ProjectSlug}/db/deploy
      Description:
        Fn::Sub: ${ProjectLabel} ${Environment} - usuario de despliegue (ddl)
      GenerateSecretString:
        SecretStringTemplate:
          Fn::Sub: '{"username": "${DeployUser}"}'
        GenerateStringKey: password
        PasswordLength: 32
        RequireEachIncludedType: true
        ExcludeCharacters: '"''`\/@ :;{}[]$&|<>'
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: /${Environment}/${ProjectSlug}/db/deploy
  DbaDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: /${Environment}/${ProjectSlug}/db/dba
      Description:
        Fn::Sub: ${ProjectLabel} ${Environment} - usuario DBA (admin)
      GenerateSecretString:
        SecretStringTemplate:
          Fn::Sub: '{"username": "${DbaUser}"}'
        GenerateStringKey: password
        PasswordLength: 32
        RequireEachIncludedType: true
        ExcludeCharacters: '"''`\/@ :;{}[]$&|<>'
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: /${Environment}/${ProjectSlug}/db/dba
  ProxyRole:
    Type: AWS::IAM::Role
    Condition: UseProxy
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: rds.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: read-db-secrets
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: ReadAppSecrets
            Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource:
            - Ref: AppDbSecret
            - Ref: ReportDbSecret
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-proxy-role
  DatabaseProxy:
    Type: AWS::RDS::DBProxy
    Condition: UseProxy
    Properties:
      DBProxyName:
        Fn::Sub: ${Environment}-${ProjectSlug}-proxy
      EngineFamily: POSTGRESQL
      RequireTLS: true
      RoleArn:
        Fn::GetAtt:
        - ProxyRole
        - Arn
      VpcSubnetIds:
        Fn::If:
        - CreateVpc
        - - Ref: PrivateSubnetA
          - Ref: PrivateSubnetB
        - Ref: ExistingPrivateSubnetIds
      VpcSecurityGroupIds:
      - Ref: ProxySecurityGroup
      IdleClientTimeout: 1800
      Auth:
      - AuthScheme: SECRETS
        IAMAuth: DISABLED
        SecretArn:
          Ref: AppDbSecret
      - AuthScheme: SECRETS
        IAMAuth: DISABLED
        SecretArn:
          Ref: ReportDbSecret
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
  DatabaseProxyTargets:
    Type: AWS::RDS::DBProxyTargetGroup
    Condition: UseProxy
    Properties:
      DBProxyName:
        Ref: DatabaseProxy
      TargetGroupName: default
      DBInstanceIdentifiers:
      - Ref: DatabaseInstance
  WebRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName:
        Fn::Sub: ${Environment}-${ProjectSlug}-web
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules": [{"rulePriority": 1, "description": "conservar las ultimas 10 imagenes", "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10}, "action": {"type": "expire"}}]}'
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
        - Sid: LambdaPullWebImage
          Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action:
          - ecr:BatchGetImage
          - ecr:GetDownloadUrlForLayer
          Condition:
            StringLike:
              aws:sourceArn:
                Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${Environment}-${ProjectSlug}-web
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-web
  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment:
          Fn::Sub: ${Environment}-${ProjectSlug}-web
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        Origins:
        - Id: web-lambda
          DomainName:
            Fn::Select:
            - 2
            - Fn::Split:
              - /
              - Fn::GetAtt:
                - WebFunctionUrl
                - FunctionUrl
          CustomOriginConfig:
            OriginProtocolPolicy: https-only
            HTTPSPort: 443
            OriginSSLProtocols:
            - TLSv1.2
            OriginReadTimeout: 30
            OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: web-lambda
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          - OPTIONS
          - PUT
          - PATCH
          - POST
          - DELETE
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          Compress: true
        CacheBehaviors:
        - PathPattern: /_next/static/*
          TargetOriginId: web-lambda
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-web-cdn
  WebFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${Environment}-${ProjectSlug}-web
      RetentionInDays:
        Fn::If:
        - IsProduction
        - 30
        - 7
  WebFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: web-logs
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: WriteLogs
            Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: ${WebFunctionLogGroup.Arn}:*
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-web-fn-role
  WebFunction:
    Type: AWS::Lambda::Function
    DependsOn:
    - WebFunctionLogGroup
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-${ProjectSlug}-web
      Description:
        Fn::Sub: ${ProjectLabel} - frontend Next.js (SSR)
      PackageType: Image
      Code:
        ImageUri:
          Fn::Sub: ${WebRepository.RepositoryUri}:latest
      Architectures:
      - x86_64
      MemorySize: 1024
      Timeout: 30
      Role:
        Fn::GetAtt:
        - WebFunctionRole
        - Arn
      Environment:
        Variables:
          AWS_LWA_PORT: '3000'
          AWS_LWA_READINESS_CHECK_PATH: /login
      Tags:
      - Key: Project
        Value:
          Ref: ProjectLabel
      - Key: Environment
        Value:
          Ref: EnvironmentTag
      - Key: Name
        Value:
          Fn::Sub: ${Environment}-${ProjectSlug}-web
  WebFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn:
        Fn::GetAtt:
        - WebFunction
        - Arn
      AuthType: NONE
      InvokeMode: BUFFERED
  WebFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: WebFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE
  WebFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: WebFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true
  WebBuilderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /codebuild/${Environment}-${ProjectSlug}-web-builder
      RetentionInDays:
        Fn::If:
        - IsProduction
        - 30
        - 7
  WebBuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: codebuild.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: web-builder
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: ReadSource
            Effect: Allow
            Action:
            - s3:GetObject
            Resource:
